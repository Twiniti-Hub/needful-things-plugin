<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugins for Grok Build</title>
<meta name="description" content="Grok Build plugins.">
<style>
:root{color-scheme:light dark;--fg:#1a1a1a;--muted:#555;--bg:#fff;--line:#ddd;--code:#f4f4f4}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--muted:#aaa;--bg:#141414;--line:#333;--code:#222}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{max-width:46rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
h1{font-size:2rem;line-height:1.2;margin:0 0 .5rem}
h2{font-size:1.25rem;margin:2.25rem 0 .5rem;padding-top:1rem;border-top:1px solid var(--line)}
p.lede{color:var(--muted);font-size:1.1rem;margin-top:0}
code{font:.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code);padding:.1em .35em;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
.note{border-left:3px solid var(--muted);padding:.25rem .9rem;color:var(--muted)}
a{color:inherit}
.cta{display:inline-block;margin:.5rem 0 1rem;padding:.6rem 1.1rem;border:1px solid var(--fg);border-radius:6px;text-decoration:none;font-weight:600}
.badge{display:inline-block;font-size:.8rem;font-weight:600;border:1px solid var(--muted);color:var(--muted);border-radius:999px;padding:0 .6rem;margin-left:.4rem;vertical-align:middle}
h3{font-size:1rem;margin:1.25rem 0 .25rem}
footer{margin-top:3rem;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<main>
<h1>Plugins for Grok Build</h1>
<p class="lede">Plugins available from this site.</p>
<table>
<tr><th>Plugin</th><th>What it does</th></tr>
<tr><td><a href="/needful-things/">Needful Things</a></td><td>Browse listings by region, check credits and posts, and prepare drafts you approve in the Needful Things app.</td></tr>
</table>
</main>
</body>
</html>
